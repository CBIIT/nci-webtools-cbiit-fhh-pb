<HTML>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <script src="{{ url_for('static', filename='js/fhh_build_pedigree.js') }}" type="module"></script>
  <script src="{{ url_for('static', filename='js/fhh_display_pedigree.js') }}" type="module"></script>
  <script src="{{ url_for('static', filename='js/fhh_load.js') }}" type="module"></script>
  <script src="{{ url_for('static', filename='js/fhh_move.js') }}" type="module"></script>
  <script src="{{ url_for('static', filename='js/fhh_session_timeout.js') }}" type="module"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pedigree.css') }}">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K1Y1MRNYJW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-K1Y1MRNYJW', {
      page_location: window.location.origin + window.location.pathname,
      page_path: window.location.pathname,
      page_referrer: (document.referrer || '').split('?')[0],
    });
  </script>

<TITLE> Pedigree Drawing </TITLE>
<BODY>
  <DIV class="grid-container">
    <DIV class='navbar grid-item'>
      <div class='debug-block'>
        <div class="special-actions-heading">Special Actions</div>
        <div class="special-actions-buttons">
          <button id="save-button" type="button" disabled>Save</button>
          <button id="save-svg-button" type="button" disabled>Export</button>
          <button id="save-pdf-button" type="button" title="Open a print view; choose Save as PDF in the print dialog" disabled>PDF</button>
          <button id="reset-layout-button" type="button" title="Discard hand-placed positions and re-run the automatic layout" disabled>Reset</button>
        </div>
      </div>
      <div class="file-block">
        <div id="selection-loading-overlay" class="selection-loading-overlay" aria-hidden="true" style="display:none;">
          <span class="selection-loading-spinner" aria-hidden="true"></span>
          <span>Loading</span>
        </div>
       Study:
        <SELECT id="study_select">
          <OPTION> </OPTION>
          <OPTION> This is where we list the studies </OPTION>
        </SELECT>
        <br/>Family:
        <SELECT id="families_select" style="width: 10ch;">
          <OPTION> </OPTION>
          <OPTION> This is where we list the pedigrees </OPTION>
        </SELECT>
        <div id="build-mode-actions" class="build-mode-actions" style="display:none;">
          <button id="new-study-button" type="button">New Study</button>
          <button id="new-family-button" type="button">New Family</button>
          <button id="save-family-button" type="button" style="display:none;">Save Family</button>
        </div>
      </div>
      <div class="view-block">
        <div class="view-column">
          <button id="undo-button" type="button" title="Undo (Cmd/Ctrl+Z)" aria-label="Undo" disabled>&#8630; Undo</button>
          <button id="redo-button" type="button" title="Redo (Cmd/Ctrl+Shift+Z)" aria-label="Redo" disabled>&#8631; Redo</button>
        </div>
        <div class="view-column">
          <div class="zoom-controls">
            <button id="zoom-out-button" type="button" title="Zoom out (Cmd/Ctrl+-)" aria-label="Zoom out">&minus;</button>
            <button id="zoom-level-button" type="button" title="Reset zoom to 100%" aria-label="Reset zoom">100%</button>
            <button id="zoom-in-button" type="button" title="Zoom in (Cmd/Ctrl+=)" aria-label="Zoom in">+</button>
          </div>
          <div class="zoom-controls">
            <button id="zoom-fit-button" type="button" title="Fit the family on screen (Cmd/Ctrl+0)">Fit</button>
            <button id="find-button" type="button" title="Find a person (Cmd/Ctrl+F)">Find</button>
          </div>
        </div>
      </div>
      <dialog id="find-dialog" class="find-dialog" aria-label="Find a person">
        <form method="dialog" class="find-dialog-form">
          <label for="find-input">Find a person</label>
          <input id="find-input" type="search" list="find-list" placeholder="ID or name" autocomplete="off">
          <datalist id="find-list"></datalist>
          <div class="find-dialog-buttons">
            <button id="find-go-button" type="button">Go</button>
            <button id="find-proband-button" type="button">Proband</button>
            <button value="cancel">Close</button>
          </div>
        </form>
      </dialog>
      <div class="radio-block">
        <div class="mode-group mode-group-actions">
          <div class="mode-group-heading">Action Mode</div>
          <div class="mode-options">
            <input type="radio" id="details" name="action_choice" value="details" checked="checked">
            <label for="details">Details</label>

            <input type="radio" id="slide" name="action_choice" value="slide">
            <label for="slide" title="You can just hold down the shift key to slide">Slide</label>

            <input type="radio" id="free" name="action_choice" value="free">
            <label for="free" title="You can hold down the control key for free movement">Free</label>
          </div>
        </div>
        <div class="mode-group mode-group-annotations">
          <div class="mode-group-heading">Annotations</div>
          <div class="annotation-tools">
            <input type="color" id="annotation-color" class="annotation-color-swatch" value="#000000" aria-label="Annotation color" title="Annotation color">
            <div class="mode-options annotation-mode-options">
            <div class="annotation-tool">
              <input type="radio" id="annotation-line" name="action_choice" value="annotation-line">
              <label for="annotation-line">Line</label>
            </div>
            <div class="annotation-tool">
              <input type="radio" id="annotation-arrow" name="action_choice" value="annotation-arrow">
              <label for="annotation-arrow">Arrow</label>
            </div>
            <div class="annotation-tool">
              <input type="radio" id="annotation-text" name="action_choice" value="annotation-text">
              <label for="annotation-text">Text</label>
            </div>
            <div class="annotation-tool">
              <input type="radio" id="annotation-select" name="action_choice" value="annotation-select">
              <label for="annotation-select">Select</label>
            </div>
            </div>
            <button id="delete-annotation-button" class="annotation-delete-button" type="button" disabled>Delete</button>
          </div>
        </div>
      </DIV>
      <div class="alertbar" id="alert">
        <button id="clear-alert-button" class="alert-clear-button" type="button" aria-label="Clear alerts" title="Clear alerts">&times;</button>
      </div>
    </DIV>
    <DIV class="textblock grid-item" id="details_textbox">  
        <div id="study_text" class="study-display-section"> <button> Close </button> </div>
        <div id="summary_text" class="summary-display-section"> <button> Close </button> </div>
        <div id="person_details" class="person-display-section">
          <div id="person_demographics">  </div>
          <div id="person_diagnoses">  </div>
          <div id="person_procedures">  </div>
          <br />
          <hr />        
          <div id="raw_data_button">  Show Raw Data </div>
          <div id="raw_data_text"></div>
        </div>
    </DIV>
    <DIV class="fhh_pedigree grid-item" id="main" style='overflow-y: scroll;'>
      Please choose a family from the dropdown above.
    </DIV>
  </DIV>

  <div id="session-timeout-overlay" class="session-timeout-overlay" aria-hidden="true" style="display:none;">
    <div class="session-timeout-dialog" role="dialog" aria-labelledby="session-timeout-title" aria-modal="true">
      <h2 id="session-timeout-title">Your session is about to expire</h2>
      <p>For your security, you will be logged out when the timer reaches zero.</p>
      <p class="session-timeout-countdown-label">
        Time remaining: <span id="session-timeout-countdown">05:00</span>
      </p>
      <div class="session-timeout-actions">
        <button id="session-extend-button" type="button">Extend session</button>
        <button id="session-logout-button" type="button" class="secondary">Log out now</button>
      </div>
    </div>
  </div>

</BODY>
</HTML>
