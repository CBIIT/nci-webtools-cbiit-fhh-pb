name: Deploy Infrastructure
permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa

jobs:
  deploy-infrastructure:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    env:
      TIER: ${{ inputs.tier }}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      SSL_CERTIFICATE_ARN: ${{ secrets.SSL_CERTIFICATE_ARN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install CDK and dependencies
        run: |
          npm install -g aws-cdk
          cd infrastructure
          npm ci

      - name: Deploy Data Bucket
        run: |
          cd infrastructure
          npx cdk deploy S3DataStack-${{ env.TIER }} --require-approval never

      - name: Deploy Lambda Functions
        run: |
          cd infrastructure
          npx cdk deploy \
          LambdaJsonProcessor-${{ env.TIER }} \
          LambdaWriteAnnotations-${{ env.TIER }} \
          LambdaGetAnnotations-${{ env.TIER }} \
          LambdaGetFamily-${{ env.TIER }} \
          LambdaListFamilies-${{ env.TIER }} \
          LambdaListStudies-${{ env.TIER }}

      - name: Deploy API Gateway and CloudFront
        run: |
          cd infrastructure
          npx cdk deploy \
          DynamoDBSession-${{ env.TIER }} \
            ApiGateway-${{ env.TIER }} \
            CloudFrontS3Stack-${{ env.TIER }} \
            --require-approval never

      # - name: Get API Gateway URL
      #   id: get-api-url
      #   run: |
      #     API_URL=$(aws cloudformation describe-stacks \
      #       --stack-name "${{ env.TIER }}-fhhpb-api-gateway" \
      #       --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayUrl'].OutputValue" \
      #       --output text)

      #     if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
      #       echo "Error: API Gateway URL not found. The API Gateway stack must be deployed successfully."
      #       exit 1
      #     fi

      #     API_URL=$(echo "$API_URL" | sed 's/\/$//')
      #     echo "api-gateway-url=$API_URL" >> $GITHUB_OUTPUT

      - name: Build frontend assets
        run: |
          cd frontend
          echo "Building with configured API Gateway URL"
          python3 build.py --api-url "/api" --tier "${{ env.TIER }}"

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/build/ s3://nci-cbiit-fhhpb-website-${{ env.TIER }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-cloudfront-s3" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "CloudFront Distribution ID not found. Redeploy CloudFront stack to get the output."
            exit 1
          fi

          echo "Invalidating CloudFront cache..."
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --output table \
            --query "Invalidation.{Status:Status,CreateTime:CreateTime}" 2>/dev/null

          if [ $? -eq 0 ]; then
            echo "CloudFront cache invalidation successful"
          else
            echo "CloudFront cache invalidation failed"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "Environment: ${{ env.TIER }}"
          echo ""
          echo "Deployed Stacks:"
          echo "  • S3DataStack-${{ env.TIER }}"
          echo "  • DynamoDBSession-${{ env.TIER }}"
          echo "  • LambdaJsonProcessor-${{ env.TIER }}"
          echo "  • LambdaWriteAnnotations-${{ env.TIER }}"
          echo "  • LambdaGetAnnotations-${{ env.TIER }}"
          echo "  • LambdaGetFamily-${{ env.TIER }}"
          echo "  • LambdaListFamilies-${{ env.TIER }}"
          echo "  • LambdaListStudies-${{ env.TIER }}"
          echo "  • ApiGateway-${{ env.TIER }}"
          echo "  • CloudFrontS3Stack-${{ env.TIER }} (includes Lambda@Edge)"
          echo ""
          echo "URLs:"
          echo "  • Frontend: https://pedigree-${{ env.TIER }}.cancer.gov"
          echo "  • Logout: https://pedigree-${{ env.TIER }}.cancer.gov/api/logout"
