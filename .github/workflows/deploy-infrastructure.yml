name: Deploy Infrastructure
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    env:
      TIER: ${{ inputs.tier }}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      SSL_CERTIFICATE_ARN: ${{ secrets.SSL_CERTIFICATE_ARN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install CDK and dependencies
        run: |
          npm install -g aws-cdk
          cd infrastructure
          npm ci

      - name: Get API Gateway URL (if exists)
        id: get-initial-api-url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-api-gateway" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ ! -z "$API_URL" ]; then
            API_URL=$(echo "$API_URL" | sed 's/\/$//')
          else
            echo "No API Gateway URL found (stack may not exist yet)"
          fi

          echo "api-url=$API_URL" >> $GITHUB_OUTPUT

      - name: Build frontend assets (required for CDK synthesis)
        run: |
          cd frontend
          if [ ! -z "${{ steps.get-initial-api-url.outputs.api-url }}" ]; then
            echo "Building with existing API configuration"
            python3 build.py --api-url "${{ steps.get-initial-api-url.outputs.api-url }}" --tier "${{ env.TIER }}"
          else
            echo "Building with local configuration (no API Gateway yet)"
            python3 build.py --tier "${{ env.TIER }}"
          fi

      - name: CDK Bootstrap
        run: |
          cd infrastructure
          npx cdk bootstrap --region ${{ env.AWS_REGION }}

      - name: Deploy Backend Infrastructure Stacks
        run: |
          cd infrastructure
          echo "Deploying backend infrastructure stacks for ${{ env.TIER }} environment..."

          # Deploy backend stacks (excluding CloudFront which needs frontend assets)
          npx cdk deploy \
            S3DataStack-${{ env.TIER }} \
            DynamoDBSession-${{ env.TIER }} \
            --require-approval never

      - name: Deploy Backend Lambda Stacks
        run: |
          cd infrastructure
          echo "Deploying backend Lambda stacks for ${{ env.TIER }} environment..."

          # Deploy data Lambda functions
          npx cdk deploy \
            LambdaJsonProcessor-${{ env.TIER }} \
            LambdaWriteAnnotations-${{ env.TIER }} \
            LambdaGetAnnotations-${{ env.TIER }} \
            LambdaGetFamily-${{ env.TIER }} \
            LambdaListFamilies-${{ env.TIER }} \
            --require-approval never

      - name: Deploy CloudFront Stack with Lambda@Edge
        run: |
          cd infrastructure
          echo "Deploying CloudFront and Lambda@Edge stacks for ${{ env.TIER }} environment..."

          npx cdk deploy \
            LambdaOidcCloudFront-${{ env.TIER }} \
            CloudFrontS3Stack-${{ env.TIER }} \
            --require-approval never

      - name: Deploy API Gateway Stack
        run: |
          cd infrastructure
          echo "Deploying API Gateway stack for ${{ env.TIER }} environment..."

          # Deploy API Gateway stack
          npx cdk deploy \
            ApiGateway-${{ env.TIER }} \
            --require-approval never

      - name: Get API Gateway URL
        id: get-api-url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-api-gateway" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayUrl'].OutputValue" \
            --output text)

          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            echo "Error: API Gateway URL not found. The API Gateway stack must be deployed successfully."
            exit 1
          fi

          API_URL=$(echo "$API_URL" | sed 's/\/$//')
          echo "api-gateway-url=$API_URL" >> $GITHUB_OUTPUT

      - name: Build frontend assets
        run: |
          cd frontend
          echo "Building with configured API Gateway URL"
          python3 build.py --api-url "${{ steps.get-api-url.outputs.api-gateway-url }}" --tier "${{ env.TIER }}"

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/build/ s3://nci-cbiit-fhhpb-website-${{ env.TIER }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-cloudfront-s3" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "CloudFront Distribution ID not found. Redeploy CloudFront stack to get the output."
            exit 1
          fi

          echo "Invalidating CloudFront cache..."
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --output table \
            --query "Invalidation.{Status:Status,CreateTime:CreateTime}" 2>/dev/null

          if [ $? -eq 0 ]; then
            echo "CloudFront cache invalidation successful"
          else
            echo "CloudFront cache invalidation failed"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "Environment: ${{ env.TIER }}"
          echo ""
          echo "Deployed Stacks:"
          echo "  • S3DataStack-${{ env.TIER }}"
          echo "  • DynamoDBSession-${{ env.TIER }} (Session Management)"
          echo "  • LambdaOidcCloudFront-${{ env.TIER }} (CloudFront Auth)"
          echo "  • LambdaJsonProcessor-${{ env.TIER }}"
          echo "  • LambdaWriteAnnotations-${{ env.TIER }}"
          echo "  • LambdaGetAnnotations-${{ env.TIER }}"
          echo "  • LambdaGetFamily-${{ env.TIER }}"
          echo "  • LambdaListFamilies-${{ env.TIER }}"
          echo "  • CloudFrontS3Stack-${{ env.TIER }}"
          echo "  • ApiGateway-${{ env.TIER }}"
          echo ""
          echo "URLs:"
          echo "  • Frontend: https://pedigree-${{ env.TIER }}.cancer.gov"
          echo "  • API: https://api-pedigree-${{ env.TIER }}.cancer.gov"
          echo "  • Logout: https://pedigree-${{ env.TIER }}.cancer.gov/api/logout"
