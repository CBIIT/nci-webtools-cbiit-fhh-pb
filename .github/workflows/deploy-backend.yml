name: Deploy Backend (API Gateway + Lambda)
permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod

jobs:
  deploy-backend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    env:
      TIER: ${{ inputs.tier || 'dev' }}
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      DATADOG_FORWARDER_FUNCTION_ARN: ${{ vars.DATADOG_FORWARDER_FUNCTION_ARN }}
      CICD_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/power-user-github-actions-cicd

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ env.CICD_ROLE_ARN }}
          role-session-name: ${{ env.TIER }}-fhhpb-backend-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install CDK dependencies
        run: |
          cd infrastructure
          npm ci

      - name: Deploy Lambda + API Gateway
        run: |
          cd infrastructure
          npx cdk deploy \
            LambdaGetAnnotations-${{ env.TIER }} \
            LambdaWriteAnnotations-${{ env.TIER }} \
            LambdaGetFamily-${{ env.TIER }} \
            LambdaListFamilies-${{ env.TIER }} \
            LambdaListStudies-${{ env.TIER }} \
            LambdaJsonProcessor-${{ env.TIER }} \
            ApiGateway-${{ env.TIER }} \
            --require-approval never

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tier:** ${{ env.TIER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
