name: Deploy JSON Processor
permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa

jobs:
  deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    env:
      TIER: ${{ inputs.tier }}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install CDK dependencies
        run: |
          cd infrastructure
          npm ci

      - name: Install and test JSON processor Lambda
        run: |
          cd backend/lambda/json-processor
          echo "Installing test dependencies..."
          pip install -r requirements.txt

          echo "Running Lambda tests..."
          python -m pytest test_lambda.py -v

      - name: Deploy JSON Processor Infrastructure
        run: |
          cd infrastructure

          echo "Deploying JSON Processor Stack..."
          npx cdk deploy LambdaJsonProcessor-${{ env.TIER }} --require-approval never

          echo "JSON Processor infrastructure deployment complete!"

      - name: Get deployment outputs
        run: |
          cd infrastructure

          echo "--- Lambda JSON Processor Stack ---"
          aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-lambda-json-processor" \
            --query "Stacks[0].Outputs" \
            --output table || echo "Lambda JSON Processor stack not found"
