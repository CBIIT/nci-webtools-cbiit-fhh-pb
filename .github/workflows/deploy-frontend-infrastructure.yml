name: Deploy Frontend Infrastructure
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
  workflow_call:
    inputs:
      tier:
        description: "Environment to deploy to"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ (inputs.tier == 'dev' || inputs.tier == 'qa') && 'nonprod' || 'prod' }}
    env:
      TIER: ${{ inputs.tier }}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      SSL_CERTIFICATE_ARN: ${{ secrets.SSL_CERTIFICATE_ARN }}
      
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install dependencies
        run: |
          cd infrastructure
          npm ci

      - name: CDK Synth
        run: |
          cd infrastructure
          npx cdk synth

      - name: Deploy CloudFront S3 Stack
        run: |
          cd infrastructure
          npx cdk deploy CloudFrontS3Stack-${{ env.TIER }} --require-approval never

      - name: Get deployment outputs
        run: |
          cd infrastructure
          echo "=== CloudFront S3 Stack Outputs ==="
          aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-cloudfront-s3" \
            --query "Stacks[0].Outputs" \
            --output table || echo "CloudFront stack not found"
