name: Deploy Backend Infrastructure
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
  workflow_call:
    inputs:
      tier:
        description: "Environment to deploy to"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TIER: ${{ inputs.tier }}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install CDK dependencies
        run: |
          cd infrastructure
          npm ci

      - name: Build frontend assets (required for CDK synthesis)
        run: |
          cd frontend
          python3 build.py

      - name: CDK Bootstrap (if needed)
        run: |
          cd infrastructure
          npx cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}
        env:
          TIER: ${{ env.TIER }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: CDK Synth
        run: |
          cd infrastructure
          npx cdk synth
        env:
          TIER: ${{ env.TIER }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Deploy Backend Infrastructure Stacks
        run: |
          cd infrastructure
          echo "=== Deploying Backend Infrastructure Stacks ==="

          # Step 1: Deploy S3 Data Stack (foundation)
          echo "1️⃣ Deploying S3 Data Stack..."
          npx cdk deploy S3DataStack-${{ env.TIER }} --require-approval never

          # Step 2: Deploy Lambda JSON Processor Stack
          echo "2️⃣ Deploying Lambda JSON Processor Stack..."
          npx cdk deploy LambdaJsonProcessor-${{ env.TIER }} --require-approval never

          # Step 3: Deploy Lambda Function Stacks (these depend on S3 Data Stack)
          echo "3️⃣ Deploying Lambda Write Annotations Stack..."
          npx cdk deploy LambdaWriteAnnotations-${{ env.TIER }} --require-approval never

          echo "4️⃣ Deploying Lambda Get Annotations Stack..."
          npx cdk deploy LambdaGetAnnotations-${{ env.TIER }} --require-approval never

          echo "5️⃣ Deploying Lambda Get Family Stack..."
          npx cdk deploy LambdaGetFamily-${{ env.TIER }} --require-approval never

          echo "6️⃣ Deploying Lambda List Families Stack..."
          npx cdk deploy LambdaListFamilies-${{ env.TIER }} --require-approval never

          # Step 4: Deploy API Gateway Stack (depends on all Lambda functions)
          echo "7️⃣ Deploying API Gateway Stack..."
          npx cdk deploy ApiGateway-${{ env.TIER }} --require-approval never

          # Step 5: Deploy S3 JSON Processor Trigger Stack (depends on S3 Data and Lambda JSON Processor)
          echo "8️⃣ Deploying S3 JSON Processor Trigger Stack..."
          npx cdk deploy S3JsonProcessorTrigger-${{ env.TIER }} --require-approval never

          echo "✅ All backend infrastructure stacks deployed successfully!"
        env:
          TIER: ${{ env.TIER }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Get deployment outputs
        run: |
          cd infrastructure
          echo "=== Backend Infrastructure Deployment Outputs ==="

          echo "--- S3 Data Stack ---"
          aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-s3-data" \
            --query "Stacks[0].Outputs" \
            --output table || echo "S3 Data stack not found"

          echo "--- Lambda JSON Processor Stack ---"
          aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-lambda-json-processor" \
            --query "Stacks[0].Outputs" \
            --output table || echo "Lambda JSON Processor stack not found"

          echo "--- Lambda Write Annotations Stack ---"
          aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-lambda-write-annotations" \
            --query "Stacks[0].Outputs" \
            --output table || echo "Lambda Write Annotations stack not found"

          echo "--- Lambda Get Annotations Stack ---"
          aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-lambda-get-annotations" \
            --query "Stacks[0].Outputs" \
            --output table || echo "Lambda Get Annotations stack not found"

          echo "--- Lambda Get Family Stack ---"
          aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-lambda-get-family" \
            --query "Stacks[0].Outputs" \
            --output table || echo "Lambda Get Family stack not found"

          echo "--- Lambda List Families Stack ---"
          aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-lambda-list-families" \
            --query "Stacks[0].Outputs" \
            --output table || echo "Lambda List Families stack not found"

          echo "--- API Gateway Stack ---"
          aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-api-gateway" \
            --query "Stacks[0].Outputs" \
            --output table || echo "API Gateway stack not found"

          echo "--- S3 JSON Processor Trigger Stack ---"
          aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-s3-json-processor-trigger" \
            --query "Stacks[0].Outputs" \
            --output table || echo "S3 JSON Processor Trigger stack not found"

      - name: Test backend infrastructure
        run: |
          echo "=== Testing Backend Infrastructure ==="

          # Test S3 Data Bucket
          echo "🗂️ Testing S3 Data Bucket..."
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-s3-data" \
            --query "Stacks[0].Outputs[?OutputKey=='DataBucketName'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ ! -z "$BUCKET_NAME" ]; then
            echo "✅ S3 Data Bucket: $BUCKET_NAME"
            aws s3 ls "s3://$BUCKET_NAME/" >/dev/null 2>&1 && echo "✅ Bucket accessible" || echo "❌ Bucket not accessible"
          else
            echo "❌ Could not retrieve S3 bucket name"
          fi

          # Test API Gateway
          echo "🌐 Testing API Gateway..."
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-api-gateway" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ ! -z "$API_URL" ]; then
            echo "✅ API Gateway URL: $API_URL"
            
            # Test CORS preflight
            echo "Testing CORS preflight..."
            curl -X OPTIONS "${API_URL}families" \
              -H "Origin: https://example.com" \
              -H "Access-Control-Request-Method: GET" \
              -H "Access-Control-Request-Headers: Content-Type" \
              -v -f --connect-timeout 10 || echo "CORS preflight test failed (may be expected)"
          else
            echo "❌ Could not retrieve API Gateway URL"
          fi

          # Test S3 JSON Processor Trigger
          echo "🔄 Testing S3 JSON Processor Trigger..."
          TRIGGER_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-s3-json-processor-trigger" \
            --query "Stacks[0].Outputs[?OutputKey=='DataBucketName'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ ! -z "$TRIGGER_BUCKET" ]; then
            echo "✅ Trigger configured for bucket: $TRIGGER_BUCKET"
            
            # Check if raw/ prefix exists (create if not)
            if ! aws s3 ls "s3://$TRIGGER_BUCKET/raw/" >/dev/null 2>&1; then
              echo "Creating raw/ prefix in bucket..."
              echo "# This folder is for raw JSON files that trigger automatic processing" | aws s3 cp - "s3://$TRIGGER_BUCKET/raw/README.txt"
            fi
            echo "✅ Raw folder ready for JSON processing triggers"
          else
            echo "❌ Could not retrieve trigger bucket information"
          fi

          echo ""
          echo "🎉 Backend Infrastructure Deployment Summary:"
          echo "📁 S3 Data Bucket: $BUCKET_NAME"
          echo "🌐 API Gateway: $API_URL"
          echo "🔄 JSON Processing: Upload files to s3://$TRIGGER_BUCKET/raw/ for automatic processing"
