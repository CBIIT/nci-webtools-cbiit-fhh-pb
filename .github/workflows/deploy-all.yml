name: Deploy All
permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod

jobs:
  deploy-all:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    env:
      TIER: ${{ inputs.tier }}
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      DATADOG_FORWARDER_FUNCTION_ARN: ${{ vars.DATADOG_FORWARDER_FUNCTION_ARN }}
      SSL_CERTIFICATE_ARN: ${{ vars.SSL_CERTIFICATE_ARN }}
      CICD_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/power-user-github-actions-cicd

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ env.CICD_ROLE_ARN }}
          role-session-name: ${{ env.TIER }}-fhhpb-deploy-all-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK and dependencies
        run: |
          npm install -g aws-cdk
          cd infrastructure
          npm ci

      - name: Deploy Data Bucket
        run: |
          cd infrastructure
          npx cdk deploy S3DataStack-${{ env.TIER }} --require-approval never

      - name: Deploy Lambda Functions
        run: |
          cd infrastructure
          npx cdk deploy \
            LambdaJsonProcessor-${{ env.TIER }} \
            LambdaWriteAnnotations-${{ env.TIER }} \
            LambdaGetAnnotations-${{ env.TIER }} \
            LambdaGetFamily-${{ env.TIER }} \
            LambdaListFamilies-${{ env.TIER }} \
            LambdaListStudies-${{ env.TIER }} \
            --require-approval never

      - name: Deploy API Gateway and CloudFront
        run: |
          cd infrastructure
          npx cdk deploy \
            DynamoDBSession-${{ env.TIER }} \
            ApiGateway-${{ env.TIER }} \
            CloudFrontS3Stack-${{ env.TIER }} \
            --require-approval never

      - name: Build frontend assets
        run: |
          cd frontend
          echo "Building with configured API Gateway URL"
          python3 build.py --api-url "/api" --tier "${{ env.TIER }}"

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/build/ s3://nci-cbiit-fhhpb-website-${{ env.TIER }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-cloudfront-s3" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "CloudFront Distribution ID not found. Redeploy CloudFront stack to get the output."
            exit 1
          fi

          echo "Invalidating CloudFront cache..."
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --output table \
            --query "Invalidation.{Status:Status,CreateTime:CreateTime}" 2>/dev/null

          if [ $? -eq 0 ]; then
            echo "CloudFront cache invalidation successful"
          else
            echo "CloudFront cache invalidation failed"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tier:** ${{ env.TIER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
