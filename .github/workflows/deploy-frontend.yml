name: Deploy Frontend (CloudFront + S3)
permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa

jobs:
  deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    env:
      TIER: ${{ inputs.tier }}
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      CICD_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/power-user-github-actions-cicd

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ env.CICD_ROLE_ARN }}
          role-session-name: ${{ env.TIER }}-fhhpb-frontend-deploy-${{ github.ref_name }}
          aws-region: ${{ env.AWS_REGION }}

      # - name: Get API Gateway URL
      #   id: get-api-url
      #   run: |
      #     API_URL=$(aws cloudformation describe-stacks \
      #       --stack-name "${{ env.TIER }}-fhhpb-api-gateway" \
      #       --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayUrl'].OutputValue" \
      #       --output text)

      #     if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
      #       echo "Error: API Gateway URL not found. The API Gateway stack must be deployed first."
      #       exit 1
      #     fi

      #     API_URL=$(echo "$API_URL" | sed 's/\/$//')
      #     echo "api-url=$API_URL" >> $GITHUB_OUTPUT

      - name: Build frontend assets
        run: |
          cd frontend
          echo "Building with API configuration"
          python3 build.py --api-url "/api" --tier "${{ env.TIER }}"

      - name: Deploy to S3
        run: |
          echo "Deploying to S3..."
          aws s3 sync frontend/build/ s3://nci-cbiit-fhhpb-website-${{ env.TIER }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-cloudfront-s3" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "CloudFront Distribution ID not found. Redeploy CloudFront stack to get the output."
            exit 1
          fi

          echo "Invalidating CloudFront cache..."
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --output table \
            --query "Invalidation.{Status:Status,CreateTime:CreateTime}" 2>/dev/null

          if [ $? -eq 0 ]; then
            echo "CloudFront cache invalidation successful"
          else
            echo "CloudFront cache invalidation failed"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "🎉 Frontend deployment complete!"
          echo "Environment: ${{ env.TIER }}"
