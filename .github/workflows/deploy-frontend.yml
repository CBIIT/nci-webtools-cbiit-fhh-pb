name: Deploy Frontend
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TIER: ${{ inputs.tier }}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Get API Gateway URL
        id: get-api-url
        run: |
          echo "Auto-detecting API Gateway URL from CloudFormation..."
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-api-gateway" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ ! -z "$API_URL" ]; then
            # Remove trailing slash for consistency
            API_URL=$(echo "$API_URL" | sed 's/\/$//')
            echo "✅ Auto-detected API Gateway URL: $API_URL"
          else
            echo "⚠️ No API Gateway URL found. Building without API configuration."
          fi

          echo "api-url=$API_URL" >> $GITHUB_OUTPUT

      - name: Build frontend assets
        run: |
          cd frontend
          if [ ! -z "${{ steps.get-api-url.outputs.api-url }}" ]; then
            echo "Building with configured API Gateway URL"
            python3 build.py --api-url "${{ steps.get-api-url.outputs.api-url }}" --tier "${{ env.TIER }}"
          else
            echo "Building without API Gateway URL (local/relative paths)"
            python3 build.py --tier "${{ env.TIER }}"
          fi

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/build/ s3://nci-cbiit-fhhpb-website-${{ env.TIER }} --delete

      - name: Get CloudFront Distribution ID
        id: get-distribution-id
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.TIER }}-fhhpb-cloudfront-s3" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          echo "distribution-id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.get-distribution-id.outputs.distribution-id }} \
            --paths "/*"
